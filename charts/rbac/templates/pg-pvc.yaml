{{- if .Values.pgPVC }}
{{- range (fromYaml (include "postgres.volumes" $)).items }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .claim }}
  labels:
    app: {{ .label }}
spec:
  {{- if not .legacy }}
  storageClassName: ""
  {{- end }}
  selector:
    matchLabels:
      app: {{ .label }}
  resources:
    requests:
      storage: {{ $.Values.pgPVC.storage }}
  accessModes:
    - ReadWriteOnce
{{- end }}
{{- end }}
