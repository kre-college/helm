{{- if .Values.deployment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- if .Values.deployment.initContainers }}
      initContainers:
        {{- if and .Values.pgDeployment .Values.pgService }}
        - name: wait-for-postgres
          image: {{ .Values.pgDeployment.image.repository }}:{{ .Values.pgDeployment.image.tag }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ .Release.Name }}-postgres -p {{ .Values.pgService.port }}; do sleep 2; done
        {{- end }}
        {{- range .Values.deployment.initContainers }}
        {{- if eq .name "migrations" }}
        - name: {{ .name }}
          image: {{ .image.repository }}:{{ .image.tag }}
          command: [ "migrate" ]
          args:
            - '-path'
            - '/migrations/'
            - '-database'
            - {{ .databaseURL }}
            - 'up'
        {{- else if eq .name "rbacgen" }}
        - name: {{ .name }}
          image: {{ .image.repository }}:{{ .image.tag }}
          args:
            - -create-admin
          volumeMounts:
            - name: config-volume
              mountPath: /config/
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.deployment.container.image.repository }}:{{ .Values.deployment.container.image.tag }}
          {{- if .Values.deployment.container.containerPort }}
          ports:
            - containerPort: {{ .Values.deployment.container.containerPort }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.deployment.container.containerPort }}
            periodSeconds: 5
          {{- end}}
          volumeMounts:
            - name: config-volume
              mountPath: /config/
          resources:
            requests:
              cpu: {{ .Values.deployment.resources.requests.cpu }}
              memory: {{ .Values.deployment.resources.requests.memory }}
            limits:
              cpu: {{ .Values.deployment.resources.limits.cpu }}
              memory: {{ .Values.deployment.resources.limits.memory }}
          args:
            - -config-path
            - /config/config.yaml
      volumes:
        - name: config-volume
          configMap:
            name: {{ .Release.Name }}-configmap
{{- end}}