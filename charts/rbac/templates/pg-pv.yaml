{{- if .Values.pgPVC }}
{{- range (fromYaml (include "postgres.volumes" $)).items }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .pv }}
  labels:
    app: {{ .label }}
spec:
  capacity:
    storage: {{ $.Values.pgPVC.storage }}
  accessModes:
    - ReadWriteOnce
  {{- if not .legacy }}
  persistentVolumeReclaimPolicy: Retain
  {{- end }}
  hostPath:
    path: {{ .hostPath }}
    type: DirectoryOrCreate
{{- end }}
{{- end }}
