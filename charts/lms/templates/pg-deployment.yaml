{{- if .Values.pgDeployment }}
{{- $volumes := (fromYaml (include "postgres.volumes" $)).items }}
{{- $data := index $volumes 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app: {{ .Release.Name }}-postgres
spec:
  replicas: {{ .Values.pgDeployment.replicas }}
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres
    spec:
      {{- if and .Values.pgPVC .Values.pgUpgrade }}
      {{- $from := index $volumes 1 }}
      initContainers:
        - name: pg-upgrade-dump
          image: {{ .Values.pgUpgrade.fromImage.repository }}:{{ .Values.pgUpgrade.fromImage.tag }}
          command: ["bash", "/scripts/dump.sh"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-pg-conf
          resources:
            requests:
              cpu: {{ .Values.pgDeployment.resources.requests.cpu }}
              memory: {{ .Values.pgDeployment.resources.requests.memory }}
            limits:
              cpu: {{ .Values.pgDeployment.resources.limits.cpu }}
              memory: {{ .Values.pgDeployment.resources.limits.memory }}
          volumeMounts:
            - name: {{ $from.name }}
              mountPath: {{ $from.mountPath }}
            - name: {{ $data.name }}
              mountPath: /upgrade
            - name: pg-upgrade-scripts
              mountPath: /scripts
        - name: pg-upgrade-restore
          image: {{ .Values.pgDeployment.image.repository }}:{{ .Values.pgDeployment.image.tag }}
          command: ["bash", "/scripts/restore.sh"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-pg-conf
          resources:
            requests:
              cpu: {{ .Values.pgDeployment.resources.requests.cpu }}
              memory: {{ .Values.pgDeployment.resources.requests.memory }}
            limits:
              cpu: {{ .Values.pgDeployment.resources.limits.cpu }}
              memory: {{ .Values.pgDeployment.resources.limits.memory }}
          volumeMounts:
            - name: {{ $data.name }}
              mountPath: {{ $data.mountPath }}
            - name: {{ $from.name }}
              mountPath: /source
            - name: pg-upgrade-scripts
              mountPath: /scripts
      {{- end }}
      containers:
        - name: {{ .Release.Name }}-postgres
          image: {{ .Values.pgDeployment.image.repository }}:{{ .Values.pgDeployment.image.tag }}
          ports:
              - containerPort: {{ .Values.pgDeployment.containerPort }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -p {{ .Values.pgDeployment.containerPort }} -U "$POSTGRES_USER"
            periodSeconds: 5
            timeoutSeconds: 5
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-pg-conf
          resources:
            requests:
              cpu: {{ .Values.pgDeployment.resources.requests.cpu }}
              memory: {{ .Values.pgDeployment.resources.requests.memory }}
            limits:
              cpu: {{ .Values.pgDeployment.resources.limits.cpu }}
              memory: {{ .Values.pgDeployment.resources.limits.memory }}
          {{- if .Values.pgPVC }}
          volumeMounts:
            - name: {{ $data.name }}
              mountPath: {{ $data.mountPath }}
          {{- end }}
      {{- if .Values.pgPVC }}
      volumes:
        {{- range $volumes }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ .claim }}
        {{- end }}
        {{- if .Values.pgUpgrade }}
        - name: pg-upgrade-scripts
          configMap:
            name: {{ .Release.Name }}-pg-upgrade
        {{- end }}
      {{- end }}
{{- end}}
